<!-- Paste this right before </body> in your live invitation page, AFTER your existing <script> -->
<script>
(function () {
  /* ---- CONFIG: use the same values as your existing page ---- */
  var SUPABASE_URL      = 'PASTE_YOUR_SUPABASE_URL';
  var SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_ANON_KEY';
  var INVITE_PARAM      = 'invite';   // the query-string name in your guest links, e.g. ?invite=UUID
  var DEADLINE          = new Date('2026-08-14T00:00:00+08:00'); // RSVP window ended Aug 13

  var MSG_DECLINED = "It's sad that we can't have you at this very special milestone of our little Jayden Kai, but we're still so excited for you to meet our little boy soon. Thank you for letting us know — we'll be thinking of you on the day. 💛";
  var MSG_NOREPLY  = "We're sorry, the RSVP window has closed. It ended on <strong>August 13, 2026</strong>. We'll gently take it that you won't be able to join us, but we're still very excited for you to meet our little boy soon. Hope we can catch up! 💛";

  var root = document.documentElement;            // always exists, even if <body> doesn't yet
  root.style.visibility = 'hidden';               // avoid flashing the details
  function reveal() { root.style.visibility = ''; }

  function showClosed(msg) {
    var hide = ['#details', '#notes', '#safety', '#rsvp', '#dress',
                '.event-pill', '.venue-line', '.scroll-cue',
                '.nav-menu', '.nav-toggle', '.mobile-menu',
                'footer .contact + .contact'];
    hide.forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (el) { el.style.display = 'none'; });
    });
    var line = document.querySelector('.hero .invite-line');
    if (line) line.innerHTML = msg;
  }

  var code = new URLSearchParams(location.search).get(INVITE_PARAM);
  if (!code || !window.supabase) { reveal(); return; }

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  db.from('rsvps').select('not_attending').eq('invite_code', code).maybeSingle()
    .then(function (res) {
      if (res.error) { reveal(); return; }
      var row = res.data;
      if (row && row.not_attending === false) { reveal(); return; }          // confirmed -> full page
      if (row && row.not_attending === true)  { showClosed(MSG_DECLINED); }  // declined
      else if (new Date() >= DEADLINE)        { showClosed(MSG_NOREPLY); }   // no reply, window closed
      reveal();
    })
    .catch(reveal);
})();
</script>
